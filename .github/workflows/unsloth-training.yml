name: Unsloth Training Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  training:
    if: ${{ vars.BOOKORA_UNSLOTH_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 360
    env:
      BOOKORA_SUPABASE_URL: ${{ secrets.BOOKORA_SUPABASE_URL }}
      BOOKORA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BOOKORA_SUPABASE_SERVICE_ROLE_KEY }}
      BOOKORA_WORKER_ID: github-${{ github.run_id }}
      BOOKORA_TRAINING_OUTPUT_DIR: ./artifacts
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./ml-training
      - name: Run one queue cycle
        run: python ./ml-training/worker.py --once --limit 1
