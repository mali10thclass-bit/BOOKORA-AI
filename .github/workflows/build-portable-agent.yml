name: Build BOOKORA AI Portable Windows App

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: BOOKORA web URL to open by default
        required: false
        default: https://bookora-ai.vercel.app
  push:
    paths:
      - desktop-agent/**
      - .github/workflows/build-portable-agent.yml

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-agent/package.json
      - name: Install desktop dependencies
        run: npm install
      - name: Build portable EXE
        run: npm run build:windows
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: BOOKORA-AI-Windows-Builds
          path: |
            desktop-agent/dist/*.exe
            desktop-agent/dist/*.yml
            desktop-agent/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
