name: Format Production Integration Branch

on:
  push:
    branches:
      - codex/production-integration-2026-09-26
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\\.(cjs|js|json|md|mjs|ts|tsx|yaml|yml)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            bunx prettier --write "${files[@]}"
          fi

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format production integration"
          git push origin HEAD:${{ github.ref_name }}

      - name: Re-run canonical CI on formatted commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
