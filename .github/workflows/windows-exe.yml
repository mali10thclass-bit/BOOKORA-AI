name: BOOKORA AI Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Compile Windows launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          bun build scripts/bookora-windows-server.ts --compile --target=bun-windows-x64 --outfile=dist/windows/BOOKORA-AI.exe
          Copy-Item -Recurse -Force dist/client dist/windows/client
      - name: Upload unsigned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BOOKORA-AI-windows-unsigned
          path: dist/windows/